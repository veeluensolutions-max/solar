<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Gradiente da Borda Squircle Dourada -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <!-- Gradiente Dourado Metálico do 'V' -->
    <linearGradient id="goldVMain" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="30%" stopColor="#F59E0B" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <linearGradient id="goldVStrip" x1="15%" y1="15%" x2="45%" y2="85%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#451A03" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Preto com Borda Dourada -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#080B11" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Símbolo do V estilizado -->
  <g transform="translate(14, 18) scale(1.0)">
    <!-- Faixa externa esquerda -->
    <path
      d="M 22 24 L 33 24 L 47 68 C 44 74 39 77 34 77 C 28 77 23 73 22 67 Z"
      fill="url(#goldVStrip)"
    />

    <!-- Corpo principal dobrado do V -->
    <path
      d="M 33 24 L 45 24 L 54 58 L 69 24 L 81 24 L 62 72 C 58 80 50 82 43 80 C 36 78 31 72 30 66 Z"
      fill="url(#goldVMain)"
    />
  </g>
</svg>